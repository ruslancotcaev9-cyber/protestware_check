name: One-time annotated tag v1.0.0
on:
  push:
    branches:
      - chore/create-v1.0.0-tag-20261104
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9de7cd38d6aa6cfd75d9452873f4d683e884545b
          fetch-depth: 0
          persist-credentials: true
      - name: Create tag only when the expected main commit is unchanged
        shell: bash
        run: |
          set -euo pipefail
          expected='9de7cd38d6aa6cfd75d9452873f4d683e884545b'
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$expected" ]]; then
            echo 'main has changed; aborting tag creation'
            exit 1
          fi
          if git ls-remote --exit-code origin 'refs/tags/v1.0.0' >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; refusing to overwrite'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.0 "$expected" -m 'protestware-check v1.0.0'
          git push origin refs/tags/v1.0.0
          actual="$(git ls-remote origin 'refs/tags/v1.0.0^{}' | cut -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Tag verification failed'
            exit 1
          fi
          echo "Verified annotated tag v1.0.0 -> $actual"
