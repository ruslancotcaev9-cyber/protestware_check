name: Git history secret scan
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned Gitleaks
        run: bash scripts/install_gitleaks.sh "$RUNNER_TEMP/security-bin"
      - name: Scan all fetched refs without exposing matches
        run: |
          # Gitleaks output may include credentials: keep stdout/stderr private.
          if "$RUNNER_TEMP/security-bin/gitleaks" git --no-banner --redact --log-opts='--all' \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-findings.json" . \
            > /dev/null 2>&1; then
            echo 'Git history secret scan: PASS'
          else
            echo 'Git history secret scan: REVIEW REQUIRED (private investigation needed)'
            exit 1
          fi
