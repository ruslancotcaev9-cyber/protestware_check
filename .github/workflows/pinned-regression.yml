name: Pinned behavioral regression (static-only)
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install trusted parser dependencies
        run: python -m pip install -r requirements-ast.txt -r requirements-resolver.txt
      - name: Install C/C++ and JavaScript/TypeScript grammars
        run: python -c "from tree_sitter_language_pack import download; download(['c','cpp','javascript','typescript','tsx'])"
      - name: Check out pinned untrusted projects as data only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/static-checkouts
          fetch_pinned() {
            local repo="$1" name="$2" commit="$3"
            git -c protocol.file.allow=never clone --no-checkout --filter=blob:none \
              "https://github.com/$repo.git" "/tmp/static-checkouts/$name"
            git -C "/tmp/static-checkouts/$name" -c core.hooksPath=/dev/null checkout --detach "$commit"
          }
          fetch_pinned fmtlib/fmt fmt 4ed3535092a96ac9f56fab80df83416d51bcc78e
          fetch_pinned Neargye/magic_enum magic_enum 7f7c70473857c47c6eb88261771c4ab3dc7616d4
          fetch_pinned Anti-Prop/antiprop_basic antiprop_basic 5df3875efa40082167b1c11012b7f4b2ad2f045a
      - name: Validate behavior and benign baselines without execution
        run: python tests/pinned_repository_regressions.py /tmp/static-checkouts
