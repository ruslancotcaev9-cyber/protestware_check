name: Pinned behavioral regression (static-only)
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install trusted parser dependencies
        run: python -m pip install -r requirements-ast.txt -r requirements-resolver.txt
      - name: Install C/C++ and JavaScript/TypeScript grammars
        run: python -c "from tree_sitter_language_pack import download; download(['c','cpp','javascript','typescript','tsx'])"
      - name: Check out pinned untrusted projects as data only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/static-checkouts
          fetch_pinned() {
            local repo="$1" name="$2" commit="$3"
            git -c protocol.file.allow=never clone --no-checkout --filter=blob:none \
              "https://github.com/$repo.git" "/tmp/static-checkouts/$name"
            git -C "/tmp/static-checkouts/$name" -c core.hooksPath=/dev/null checkout --detach "$commit"
          }
          fetch_pinned fmtlib/fmt fmt 4ed3535092a96ac9f56fab80df83416d51bcc78e
          fetch_pinned Neargye/magic_enum magic_enum 7f7c70473857c47c6eb88261771c4ab3dc7616d4
          fetch_pinned Anti-Prop/antiprop_basic antiprop_basic 5df3875efa40082167b1c11012b7f4b2ad2f045a
      - name: Validate behavior and benign baselines without execution
        run: python tests/pinned_repository_regressions.py /tmp/static-checkouts

  geo-author:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: 18f3b6cf84b88c9a6cc3a1a5200cb77a1038d29d
          path: reference-scanner
          persist-credentials: false
      - name: Prepare pinned sources as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I scripts/evaluate_geo.py prepare --sources "$RUNNER_TEMP/geo-sources"
      - name: Score the previous and current detectors on identical inputs
        run: |
          cp scripts/evaluate_geo.py reference-scanner/scripts/
          cp corpus_evaluation.py reference-scanner/
          cp tests/corpus/geo-v1-scanner-sha256.json reference-scanner/tests/corpus/
          python -I reference-scanner/scripts/evaluate_geo.py compare --sources "$RUNNER_TEMP/geo-sources" --output "$RUNNER_TEMP/geo-reference.json"
          python -I scripts/evaluate_geo.py compare --sources "$RUNNER_TEMP/geo-sources" --output "$RUNNER_TEMP/geo-comparison.json"
          python -I scripts/evaluate_geo.py compare --sources "$RUNNER_TEMP/geo-sources" --output "$RUNNER_TEMP/geo-repeat.json"
      - name: Check locations and repeatability
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import base64
          from hashlib import sha256
          import json
          from pathlib import Path

          reference = json.loads(Path('geo-reference.json').read_bytes())
          archived = reference['comparison']['reference']
          if (reference['detector_manifest_sha256'] != archived['detector_manifest_sha256']
                  or reference['overall'] != archived['overall'] or reference['analysis'] != archived['analysis']
                  or any(c['before'] != c['after'] for c in reference['comparison']['cases'])):
              raise SystemExit('The previous detector no longer reproduces the archived evaluation')
          raw = Path('geo-comparison.json').read_bytes()
          first = json.loads(raw)
          repeat = json.loads(Path('geo-repeat.json').read_bytes())
          for report in (first, repeat):
              for field in ('elapsed_seconds', 'median_case_seconds'):
                  del report['performance'][field]
          if first != repeat:
              raise SystemExit('The two runs differ outside the timing fields')
          cases = {c['id']: c for c in first['comparison']['cases']}
          if not first['analysis']['complete'] or first['overall']['fp'] or cases['geo-4']['after']['outcome'] != 'tp':
              raise SystemExit('Incomplete analysis, false positive or missing reviewed action in geo-4')
          print('GEO_REPORT_SHA256=' + sha256(raw).hexdigest())
          encoded = base64.b64encode(raw).decode('ascii')
          for offset in range(0, len(encoded), 2048):
              print('GEO_REPORT_BYTES=' + encoded[offset:offset + 2048])
          PY
      - name: Save the author comparison and repeat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geo-author-comparison
          path: |
            ${{ runner.temp }}/geo-reference.json
            ${{ runner.temp }}/geo-comparison.json
            ${{ runner.temp }}/geo-repeat.json
          if-no-files-found: warn
          retention-days: 14
