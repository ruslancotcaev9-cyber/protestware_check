name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AST and resolver dependencies
        run: python -m pip install -r requirements-resolver.txt -r requirements-ast.txt
      - name: Download grammar files
        run: python -c "from tree_sitter_language_pack import download; download(['go','csharp','javascript','typescript','tsx','sql','html','css','scss','less'])"
      - name: Python syntax checks
        run: python -m compileall -q .
      - name: Regression and parser tests
        run: python -m unittest discover -s tests -v
