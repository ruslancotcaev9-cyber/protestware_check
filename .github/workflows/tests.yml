name: Unit tests
on:
  push:
  pull_request:
jobs:
  malware-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test malware-advisory integrations without external downloads
        run: python -m unittest discover -s tests -p 'test_malware_intel.py' -v
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install AST and resolver dependencies
        run: python -m pip install -r requirements-resolver.txt -r requirements-ast.txt
      - name: Download grammar files (retry transient upstream errors)
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -c "from tree_sitter_language_pack import download; download(['go','csharp','javascript','typescript','tsx','sql','html','css','scss','less','c','cpp'])"; then
              exit 0
            fi
            echo "Grammar download unavailable; retry ${attempt}/6" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Python syntax checks
        run: python -m compileall -q .
      - name: Regression and parser tests
        run: python -m unittest discover -s tests -v
      - name: Labeled static corpus and resource measurements
        run: python scripts/evaluate_corpus.py --measure --output corpus-metrics.json
      - name: Save corpus metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-metrics
          path: corpus-metrics.json
          if-no-files-found: error
          retention-days: 14
