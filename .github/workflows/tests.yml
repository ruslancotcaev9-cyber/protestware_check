name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile protestware_check.py ast_analysis.py threat_intel.py
      - run: python -m unittest discover -s tests -v
