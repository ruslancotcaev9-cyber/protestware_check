name: Draft release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            python3 - "$GITHUB_REF_NAME" <<'PY'
          import ast
          import pathlib
          import sys
          tree = ast.parse(pathlib.Path('protestware_check.py').read_text(encoding='utf-8'))
          versions = [n.value.value for n in tree.body if isinstance(n, ast.Assign)
                      for target in n.targets if isinstance(target, ast.Name) and target.id == 'VERSION'
                      if isinstance(n.value, ast.Constant) and isinstance(n.value.value, str)]
          assert versions == [sys.argv[1].removeprefix('v')], 'Version/tag mismatch'
          PY
          fi
      - name: Install scanner test dependencies
        run: python3 -m pip install -r requirements-resolver.txt -r requirements-ast.txt
      - name: Download grammar files
        run: python3 -c "from tree_sitter_language_pack import download; download(['go','csharp','javascript','typescript','tsx','sql','html','css','scss','less','c','cpp'])"
      - name: Run complete tests
        run: |
          python3 -m compileall -q .
          python3 -m unittest discover -s tests -v
      - name: Install pinned secret scanner
        run: bash scripts/install_gitleaks.sh "$RUNNER_TEMP/security-bin"
      - name: Secret history gate
        run: |
          # Gitleaks output may include credentials: keep stdout/stderr private.
          if "$RUNNER_TEMP/security-bin/gitleaks" git --no-banner --redact --log-opts='--all' \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-findings.json" . \
            > /dev/null 2>&1; then
            echo 'Git history secret scan: PASS'
          else
            echo 'Git history secret scan: REVIEW REQUIRED (private investigation needed)'
            exit 1
          fi
  release_draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact reviewed commit and hash it
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          git archive --format=zip --output="dist/protestware-check-${tag}.zip" "$GITHUB_SHA"
          (cd dist && sha256sum "protestware-check-${tag}.zip" > SHA256SUMS)
      - name: Create draft release only; maintainers publish manually
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == 'v1.0.0' ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
              --title "protestware-check $GITHUB_REF_NAME" \
              --notes-file docs/releases/v1.0.0.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
              --title "protestware-check $GITHUB_REF_NAME" --generate-notes
          fi
