# Copy into the TARGET repository's .github/workflows/ after reviewing permissions.
# Requires GitHub Code Scanning availability. Only the trusted scanner is executed.
# Replace the scanner SHA only after reviewing/testing the intended scanner version.
name: Protestware Code Scanning
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          path: target
          persist-credentials: false
      - name: Check out reviewed scanner separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ruslancotcaev9-cyber/protestware_check
          ref: f79541b020d6992b5ebae3ae76d5530e03c5d228
          path: scanner
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare trusted scanner dependencies and grammar cache
        working-directory: scanner
        run: |
          python -m pip install -r requirements-ast.txt -r requirements-resolver.txt
          python -c "from tree_sitter_language_pack import download; download(['go','csharp','javascript','typescript','tsx','sql','html','css','scss','less','c','cpp'])"
      - name: Scan target without executing its dependencies
        id: scan
        working-directory: target
        shell: bash
        run: |
          status=0
          python ../scanner/protestware_check.py --path . --dependencies lock \
            --project-id "$GITHUB_REPOSITORY" \
            --watchlists off --malware-intel off --ast-mode required \
            --format sarif --output "$RUNNER_TEMP/protestware.sarif" --fail-on high || status=$?
          if [[ -f "$RUNNER_TEMP/protestware.sarif" ]]; then
            echo 'report_ready=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Upload available SARIF while preserving scan failure
        if: always() && steps.scan.outputs.report_ready == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/protestware.sarif
          checkout_path: ${{ github.workspace }}/target
          category: protestware-check
