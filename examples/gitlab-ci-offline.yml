# Set PROTESTWARE_IMAGE_REPOSITORY to the approved repository in your internal registry.
# Copy the image lock shipped with the OCI archive to .gitlab/protestware-image.yml.
include:
  - local: '/.gitlab/protestware-image.yml'

stages: [security_scan, security_gate]

protestware_scan:
  extends: .protestware_image
  stage: security_scan
  script:
    - >-
      python -I /opt/protestware/scripts/gitlab_scan.py --source . --output-dir .protestware-reports --
      --project-id "$CI_PROJECT_PATH" --policy /opt/protestware/examples/policy.toml
      --ast-mode required --dependencies lock --watchlists off --malware-intel off
      --exclude '.protestware-reports/**'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [.protestware-reports/]

protestware_gate:
  extends: .protestware_image
  stage: security_gate
  needs:
    - job: protestware_scan
      artifacts: true
  script:
    - python -I /opt/protestware/scripts/gitlab_gate.py .protestware-reports
